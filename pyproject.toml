[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "tunnel-manager"
dynamic = ["version"]
description = "A local web UI to manage SSH port-forward tunnels (-L / -R / -D) with keep-alive, favourites and history."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "tunnel-manager contributors" }]
keywords = ["ssh", "tunnel", "port-forwarding", "autossh", "devtools"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Internet",
  "Topic :: System :: Networking",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "playwright>=1.45",
]

[project.scripts]
tunnel-manager = "tunnel_manager.cli:main"

[project.urls]
Homepage = "https://github.com/matevosashot/tunnel_manager"
Issues = "https://github.com/matevosashot/tunnel_manager/issues"

[tool.hatch.version]
path = "src/tunnel_manager/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tunnel_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with"]
